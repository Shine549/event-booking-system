apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-booking-frontend
  namespace: event-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-booking-frontend
  template:
    metadata:
      labels:
        app: event-booking-frontend
    spec:
      containers:
        - name: frontend
          image: event-booking-frontend:k8s
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-booking-frontend
  namespace: event-booking
spec:
  selector:
    app: event-booking-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
