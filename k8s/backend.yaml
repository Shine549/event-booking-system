apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-booking-backend
  namespace: event-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-booking-backend
  template:
    metadata:
      labels:
        app: event-booking-backend
    spec:
      containers:
        - name: backend
          image: event-booking-backend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: event-booking-backend-env
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-booking-backend
  namespace: event-booking
spec:
  selector:
    app: event-booking-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP
