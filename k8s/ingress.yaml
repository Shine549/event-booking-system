apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-booking
  namespace: event-booking
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: event-booking-backend
                port:
                  number: 5000
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: event-booking-backend
                port:
                  number: 5000
          - path: /assets/media
            pathType: Prefix
            backend:
              service:
                name: event-booking-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-booking-frontend
                port:
                  number: 80
